name: Build and Publish Docker image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t relay .

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do docker tag relay "$IMAGE:$tag"; docker push "$IMAGE:$tag"; done

      - name: Deploy to Coolify
        if: github.event_name != 'pull_request'
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_HOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: '[ -z "$HOOK" ] || curl -fsS -H "Authorization: Bearer $TOKEN" "$HOOK"'
